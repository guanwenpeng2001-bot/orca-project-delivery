<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Client adds the version header</title>
  <desc>The client sends Accept-Version on the request; the server answers with the nested body.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="40" y="40" width="200" height="64" rx="4"/>
    <rect x="400" y="40" width="200" height="64" rx="4"/>
  </g>
  <text x="140" y="78" text-anchor="middle" font-size="14" fill="currentColor">Client</text>
  <text x="500" y="78" text-anchor="middle" font-size="14" fill="currentColor">Server</text>
  <path d="M240 150 H400" stroke="currentColor" stroke-width="2" fill="none"/>
  <path d="M388 144 L400 150 L388 156" fill="currentColor"/>
  <text x="320" y="142" text-anchor="middle" font-size="14" fill="currentColor">Accept-Version: 2</text>
</svg>
